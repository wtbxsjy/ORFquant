# =============================================================================
# GitHub Actions: CI - Check, test, and verify on every push and PR
# =============================================================================

name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  r-cmd-check:
    runs-on: ubuntu-latest
    name: R CMD check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("remotes", "BiocManager", "rcmdcheck"), repos = "https://cloud.r-project.org", quiet = TRUE)'
          # Parse DESCRIPTION manually (no external package needed)
          Rscript -e '
            dcf <- read.dcf("DESCRIPTION")
            dep_fields <- c("Depends", "Imports", "Suggests")
            all_deps <- character(0)
            for (f in dep_fields) {
              if (f %in% colnames(dcf)) {
                deps <- unlist(strsplit(gsub("\\n", " ", dcf[1, f]), ",\\s*"))
                deps <- gsub("\\s*\\(.*\\)", "", deps)
                deps <- trimws(deps)
                all_deps <- c(all_deps, deps)
              }
            }
            base_pkgs <- rownames(installed.packages(priority = "base"))
            all_deps <- setdiff(all_deps, c("R", base_pkgs))
            if (length(all_deps) > 0) {
              BiocManager::install(all_deps, update = FALSE, ask = FALSE)
            }
          '

      - name: R CMD check
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning")
        shell: Rscript {0}
