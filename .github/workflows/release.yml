# =============================================================================
# GitHub Actions: Build and Release ORFquant on version tags
# =============================================================================
#
# Trigger: push a tag like v1.3.2
#   git tag v1.3.2
#   git push origin v1.3.2
#
# Result: GitHub Release with:
#   - ORFquant_X.Y.Z.tar.gz           (R source package)
#   - Singularity.orfquant.def        (Apptainer container definition)
# =============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    name: Build R package and create release

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Extract version from tag (strip leading 'v')
      # ------------------------------------------------------------------
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      # ------------------------------------------------------------------
      # 3. Setup R with Bioconductor
      # ------------------------------------------------------------------
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: 'release'

      # ------------------------------------------------------------------
      # 4. Install system dependencies
      # ------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      # ------------------------------------------------------------------
      # 5. Install R package dependencies (Depends + Imports + Suggests)
      # ------------------------------------------------------------------
      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("remotes", "BiocManager"), repos = "https://cloud.r-project.org", quiet = TRUE)'
          # Parse DESCRIPTION manually
          Rscript -e '
            dcf <- read.dcf("DESCRIPTION")
            dep_fields <- c("Depends", "Imports", "Suggests")
            all_deps <- character(0)
            for (f in dep_fields) {
              if (f %in% colnames(dcf)) {
                deps <- unlist(strsplit(gsub("\\n", " ", dcf[1, f]), ",\\s*"))
                deps <- gsub("\\s*\\(.*\\)", "", deps)
                deps <- trimws(deps)
                all_deps <- c(all_deps, deps)
              }
            }
            base_pkgs <- rownames(installed.packages(priority = "base"))
            all_deps <- setdiff(all_deps, c("R", base_pkgs))
            if (length(all_deps) > 0) {
              BiocManager::install(all_deps, update = FALSE, ask = FALSE)
            }
          '

      # ------------------------------------------------------------------
      # 6. Build R package source tarball
      # ------------------------------------------------------------------
      - name: Build source package
        run: |
          R CMD build .
          echo "PKG_FILE=$(ls ORFquant_*.tar.gz)" >> $GITHUB_ENV
          echo "Built: $(ls -lh ORFquant_*.tar.gz)"

      # ------------------------------------------------------------------
      # 7. Verify the built package
      # ------------------------------------------------------------------
      - name: Verify package
        run: R CMD check --no-manual --no-tests ${{ env.PKG_FILE }}
        continue-on-error: true

      # ------------------------------------------------------------------
      # 8. Copy Singularity definition for release
      # ------------------------------------------------------------------
      - name: Prepare container definition
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEF_FILE="inst/containers/Singularity.orfquant.def"
          DEF_RELEASE="Singularity.orfquant_${VERSION}.def"
          cp "${DEF_FILE}" "${DEF_RELEASE}"
          echo "DEF_RELEASE=${DEF_RELEASE}" >> $GITHUB_ENV
          echo "Container definition: ${DEF_RELEASE}"

      # ------------------------------------------------------------------
      # 9. Create GitHub Release and upload assets
      # ------------------------------------------------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ORFquant v${{ steps.version.outputs.version }}"
          body: |
            ## ORFquant ${{ steps.version.outputs.version }}

            Splice-aware quantification of ORF translation using Ribo-seq data.

            ### R Package Installation

            ```r
            # Install from release tarball
            install.packages(
              "ORFquant_${{ steps.version.outputs.version }}.tar.gz",
              repos = NULL, type = "source"
            )

            # Or from GitHub
            remotes::install_github("wtbxsjy/ORFquant", ref = "${{ github.ref_name }}")
            ```

            ### Singularity/Apptainer Container

            Build the container locally:

            ```bash
            # Download the definition file and build
            apptainer build --fakeroot orfquant_${{ steps.version.outputs.version }}.sif \\
                Singularity.orfquant_${{ steps.version.outputs.version }}.def

            # Use the container
            apptainer exec orfquant_${{ steps.version.outputs.version }}.sif Rscript your_script.R
            ```

            ### Changes

            - **Modernized R code**: R >= 4.0.0, S4 accessor functions, type-stable vapply(), nrow()/ncol()
            - **Performance**: DPSS caching (3-34x speedup), pre-allocation, early filtering
            - **Robustness**: S4 slot access replaced with accessor functions (BioC-compatible)
            - **Testing**: testthat unit tests for modernization patterns + DPSS performance

            See [commit history](https://github.com/wtbxsjy/ORFquant/commits/dev) for full details.
          files: |
            ${{ env.PKG_FILE }}
            ${{ env.DEF_RELEASE }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
