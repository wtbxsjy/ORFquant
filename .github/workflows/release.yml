# =============================================================================
# GitHub Actions: Build and Release ORFquant on version tags
# =============================================================================
#
# Trigger: push a tag like v1.3.2
#   git tag v1.3.2
#   git push origin v1.3.2
#
# Result: GitHub Release with:
#   - ORFquant_X.Y.Z.tar.gz  (R source package)
#   - orfquant_X.Y.Z.sif     (Singularity/Apptainer container)
# =============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # =========================================================================
  # Job 1: Build R source package
  # =========================================================================
  build-r-package:
    runs-on: ubuntu-latest
    name: Build R package
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup Bioconductor
        uses: grimbough/bioc-actions/setup-bioc@v1
        with:
          bioc-version: 'release'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("remotes", "BiocManager"), repos = "https://cloud.r-project.org", quiet = TRUE)'
          # Parse DESCRIPTION manually (no external package needed)
          Rscript -e '
            dcf <- read.dcf("DESCRIPTION")
            dep_fields <- c("Depends", "Imports")
            all_deps <- character(0)
            for (f in dep_fields) {
              if (f %in% colnames(dcf)) {
                deps <- unlist(strsplit(gsub("\\n", " ", dcf[1, f]), ",\\s*"))
                deps <- gsub("\\s*\\(.*\\)", "", deps)  # remove version specs
                deps <- trimws(deps)
                all_deps <- c(all_deps, deps)
              }
            }
            base_pkgs <- rownames(installed.packages(priority = "base"))
            all_deps <- setdiff(all_deps, c("R", base_pkgs))
            if (length(all_deps) > 0) {
              BiocManager::install(all_deps, update = FALSE, ask = FALSE)
            }
          '

      - name: Build source package
        run: |
          R CMD build .
          echo "PKG_FILE=$(ls ORFquant_*.tar.gz)" >> $GITHUB_ENV

      - name: Verify package
        run: R CMD check --no-manual --no-tests ${{ env.PKG_FILE }}
        continue-on-error: true

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-package
          path: ORFquant_*.tar.gz
          retention-days: 7

  # =========================================================================
  # Job 2: Build Singularity/Apptainer container
  # =========================================================================
  build-container:
    runs-on: ubuntu-latest
    name: Build Singularity container
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Apptainer
        run: |
          # Apptainer official install (Ubuntu 24.04)
          curl -fsSL https://packagecloud.io/install/repositories/apptainer/apptainer/script.deb.sh | sudo bash
          sudo apt-get install -y --no-install-recommends \
            apptainer squashfuse fuse-overlayfs uidmap
          apptainer version

      - name: Build container
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEF_FILE="inst/containers/Singularity.orfquant.def"
          SIF_FILE="orfquant_${VERSION}.sif"

          echo "Building ${SIF_FILE} from ${DEF_FILE} ..."
          sudo apptainer build --fakeroot "${SIF_FILE}" "${DEF_FILE}"
          echo "Container built: $(ls -lh ${SIF_FILE})"

      - name: Upload container artifact
        uses: actions/upload-artifact@v4
        with:
          name: singularity-container
          path: orfquant_*.sif
          retention-days: 7

  # =========================================================================
  # Job 3: Create GitHub Release with all artifacts
  # =========================================================================
  create-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs: [build-r-package, build-container]
    if: success() || needs.build-r-package.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download R package
        uses: actions/download-artifact@v4
        with:
          name: r-package
          path: artifacts

      - name: Download container
        uses: actions/download-artifact@v4
        with:
          name: singularity-container
          path: artifacts
        continue-on-error: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ORFquant v${{ steps.version.outputs.version }}"
          body: |
            ## ORFquant ${{ steps.version.outputs.version }}

            Splice-aware quantification of ORF translation using Ribo-seq data.

            ### Installation

            #### From R package (recommended)

            ```r
            # Direct install from release tarball
            install.packages(
              "ORFquant_${{ steps.version.outputs.version }}.tar.gz",
              repos = NULL, type = "source"
            )

            # Or from GitHub
            remotes::install_github("wtbxsjy/ORFquant", ref = "${{ github.ref_name }}")
            ```

            #### With Singularity/Apptainer container

            ```bash
            # Use the pre-built container
            apptainer exec orfquant_${{ steps.version.outputs.version }}.sif Rscript your_script.R

            # Or build locally
            apptainer build --fakeroot orfquant_${{ steps.version.outputs.version }}.sif \\
                inst/containers/Singularity.orfquant.def
            ```

            ### Changes in v${{ steps.version.outputs.version }}

            - **Modernized R code**: R >= 4.0.0, S4 accessor functions, type-stable vapply(), nrow()/ncol()
            - **Performance**: DPSS caching (3-34x speedup), pre-allocation, early filtering
            - **Robustness**: S4 slot access replaced with accessor functions (BioC-compatible)
            - **Testing**: testthat unit tests for modernization patterns + DPSS performance

            See commit history for full details.
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
